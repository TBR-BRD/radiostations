name: Update station catalog

on:
  push:
    branches: [main]
    paths:
      - "stations_source.py"
      - "generate.py"
  schedule:
    # Safety net in case a push-triggered run was ever missed - the 1st of
    # every month at 04:00 UTC (the closest reliable approximation of
    # "every 4 weeks" plain cron syntax supports).
    - cron: "0 4 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate stations.json
        run: python3 generate.py stations.json

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- stations.json; then
            echo "No changes - station catalog is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stations.json
          git commit -m "Update station catalog ($(date -u +%Y-%m-%d))"
          git push
